<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upravljanje Bookingom Tura</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDKs (Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- EKRAN ZA PRIJAVU (LOGIN SCREEN) -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-6 sm:p-8">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl mb-3">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Prijava u Sustav</h2>
        <p class="text-xs text-slate-500 mt-1">Unesite lozinku za pristup aplikaciji</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Lozinka za pristup</label>
          <input type="password" id="loginPassword" required placeholder="Unesite lozinku..." 
                 class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
        </div>

        <div id="loginError" class="hidden text-xs font-semibold text-red-500 text-center bg-red-50 p-2.5 rounded-lg border border-red-100">
          Pogrešna lozinka. Pokušajte ponovno.
        </div>

        <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Prijavi se
        </button>
      </form>
    </div>
  </div>

  <!-- MODAL ZA UNOS NOVOG BOOKINGA (Samo za Admina) -->
  <div id="bookingModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-lg p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="file-plus" class="w-5 h-5 text-indigo-600"></i>
          Novi Booking
        </h2>
        <button onclick="closeBookingModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="bookingForm" onsubmit="handleCreateBooking(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Vrijeme tura</label>
          <input type="text" id="time" placeholder="14:30" maxlength="5" oninput="formatTimeInput(this)" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Mjesto Pick-up</label>
          <input type="text" id="pickup" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Vrsta Vozila</label>
          <select id="vehicleType" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="Cabrio Bus">Cabrio Bus</option>
            <option value="Tuk Tuk">Tuk Tuk</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Broj osoba</label>
            <input type="number" id="pax" min="0" max="100" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 mb-1">Cijena (€)</label>
            <input type="number" id="price" step="0.01" min="0" placeholder="0.00" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Broj telefona</label>
          <input type="tel" id="phone" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-600 mb-1">Napomena (opcionalno)</label>
          <textarea id="note" rows="2" placeholder="Unesite napomenu ako postoji..." class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
        </div>

        <div class="flex items-center justify-end gap-2 pt-2">
          <button type="button" onclick="closeBookingModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-200 text-slate-700 hover:bg-slate-300 transition-all">Odustani</button>
          <button type="submit" id="submitBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-5 rounded-xl text-xs shadow-sm transition-all flex items-center gap-1.5">
            <i data-lucide="plus" class="w-4 h-4"></i> Spremi Booking
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL ZA UPRAVLJANJE VOZAČIMA (Samo za Admina) -->
  <div id="driversModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 mb-4">
        <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="users" class="w-5 h-5 text-indigo-600"></i>
          Upravljanje Vozačima
        </h2>
        <button onclick="closeDriversModal()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Dodavanje novog vozača -->
      <form onsubmit="handleAddDriver(event)" class="flex gap-2 mb-4">
        <input type="text" id="newDriverName" required placeholder="Ime novog vozača..." class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-xs rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl transition-all shrink-0 flex items-center gap-1">
          <i data-lucide="user-plus" class="w-3.5 h-3.5"></i> Dodaj
        </button>
      </form>

      <!-- Lista vozača -->
      <div class="space-y-2">
        <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1">Popis aktuelnih vozača</label>
        <div id="driversListContainer" class="space-y-2 max-h-56 overflow-y-auto pr-1">
          <!-- Dinamički popis vozača -->
        </div>
      </div>

      <div class="mt-6 pt-3 border-t border-slate-100 flex justify-end">
        <button type="button" onclick="closeDriversModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-all">
          Zatvori
        </button>
      </div>
    </div>
  </div>

  <!-- GLAVNA APLIKACIJA -->
  <div id="appScreen" class="max-w-5xl mx-auto p-4 sm:p-6 hidden">
    <!-- Header -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 mb-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <div class="flex items-center gap-2">
            <i data-lucide="bus" class="w-7 h-7 text-indigo-600"></i>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Booking Tura</h1>
          </div>
          <p class="text-sm text-slate-500 mt-0.5">Online evidencija i dodjela vozača</p>
        </div>

        <!-- Prikaz uloge i Odjava -->
        <div class="flex items-center gap-3">
          <div id="userRoleBadge" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 flex items-center gap-1.5">
            <i data-lucide="shield" class="w-4 h-4"></i>
            <span>Prijavljen</span>
          </div>
          <button onclick="handleLogout()" class="px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:text-red-600 hover:bg-red-50 transition-all border border-slate-200/80 flex items-center gap-1.5" title="Odjava">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            Odjava
          </button>
        </div>
      </div>
    </header>

    <!-- Kontrolna Traka: Datum, Filteri i Gumbovi Akcija -->
    <div class="space-y-4">
      
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 flex flex-col md:flex-row items-center justify-between gap-3">
        <!-- Odabir datuma i Filteri -->
        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
          <div class="relative flex-1 sm:flex-none">
            <input type="date" id="filterDate" onchange="loadBookings()" 
                   class="bg-slate-50 border border-slate-300 text-slate-900 text-xs font-semibold rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none w-full sm:w-auto">
          </div>
          <select id="filterDriver" onchange="renderBookings()" class="bg-slate-50 border border-slate-300 text-slate-900 text-xs rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none flex-1 sm:flex-none">
            <option value="">Svi vozači</option>
          </select>
          <select id="filterVehicle" onchange="renderBookings()" class="bg-slate-50 border border-slate-300 text-slate-900 text-xs rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none flex-1 sm:flex-none">
            <option value="">Sva vozila</option>
            <option value="Cabrio Bus">Cabrio Bus</option>
            <option value="Tuk Tuk">Tuk Tuk</option>
          </select>
        </div>

        <!-- Akcijski Gumbovi za Admina (Novi Booking, Vozači, Excel) -->
        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
          <button id="openBookingModalBtn" onclick="openBookingModal()" class="hidden bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2.5 px-3.5 rounded-xl shadow-sm transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            Novi Booking
          </button>

          <button id="openDriversModalBtn" onclick="openDriversModal()" class="hidden bg-slate-700 hover:bg-slate-800 text-white text-xs font-semibold py-2.5 px-3.5 rounded-xl shadow-sm transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="users" class="w-4 h-4"></i>
            Vozači
          </button>

          <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 px-3.5 rounded-xl shadow-sm transition-all flex items-center justify-center gap-1.5">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
            Excel
          </button>
        </div>
      </div>

      <!-- Prikaz Lista Bookinga -->
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 pb-4 border-b border-slate-100">
          <div>
            <h2 id="displayDateTitle" class="text-lg font-bold text-slate-900">Raspored Tura</h2>
            <p class="text-xs text-slate-500">Booking sortiran kronološki po vremenu</p>
          </div>
          
          <span id="bookingCount" class="self-start sm:self-auto bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-full border border-indigo-100">
            0 vožnji
          </span>
        </div>

        <div id="bookingsList" class="space-y-3.5">
          <!-- Dinamički sadržaj -->
        </div>
      </div>

    </div>
  </div>

  <script>
    const PASSWORDS = {
      admin123: 'admin',
      vozac123: 'driver'
    };

    const firebaseConfig = {
      apiKey: "AIzaSyDECTTtb5SYZJ_xUJWB1ySi2NxBXZoV13w",
      authDomain: "online-management-1315c.firebaseapp.com",
      databaseURL: "https://online-management-1315c-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "online-management-1315c",
      storageBucket: "online-management-1315c.firebasestorage.app",
      messagingSenderId: "243674230357",
      appId: "1:243674230357:web:93b0ed58009575ef0a2edc",
      measurementId: "G-VWBNBQGSH4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRole = null; 
    let activeDate = new Date().toISOString().split('T')[0];
    let bookingsData = {};
    let driversList = [];
    let editingBookingId = null; 
    let driverAddingNoteId = null; 

    window.formatTimeInput = function(input) {
      let val = input.value.replace(/\D/g, '');
      if (val.length >= 3) {
        input.value = val.substring(0, 2) + ':' + val.substring(2, 4);
      } else {
        input.value = val;
      }
    };

    window.openBookingModal = function() {
      document.getElementById('bookingModal').classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    };

    window.closeBookingModal = function() {
      document.getElementById('bookingModal').classList.add('hidden');
    };

    window.openDriversModal = function() {
      document.getElementById('driversModal').classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    };

    window.closeDriversModal = function() {
      document.getElementById('driversModal').classList.add('hidden');
    };

    window.handleLogin = function(e) {
      if (e) e.preventDefault();
      const passInput = document.getElementById('loginPassword');
      const pass = passInput.value.trim();
      const errorEl = document.getElementById('loginError');

      if (PASSWORDS[pass]) {
        const role = PASSWORDS[pass];
        localStorage.setItem('tour_app_role', role);
        errorEl.classList.add('hidden');
        passInput.value = '';
        activeDate = new Date().toISOString().split('T')[0];
        initApp(role);
      } else {
        errorEl.classList.remove('hidden');
        passInput.value = '';
      }
    };

    window.handleLogout = function() {
      localStorage.removeItem('tour_app_role');
      currentRole = null;
      document.getElementById('appScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    };

    function initApp(role) {
      currentRole = role;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      document.getElementById('filterDate').value = activeDate;

      const badge = document.getElementById('userRoleBadge');
      const openBookingBtn = document.getElementById('openBookingModalBtn');
      const openDriversBtn = document.getElementById('openDriversModalBtn');

      if (role === 'admin') {
        badge.innerHTML = `<i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i> Admin`;
        badge.className = "px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-100 flex items-center gap-1.5";
        openBookingBtn.classList.remove('hidden');
        openDriversBtn.classList.remove('hidden');
      } else {
        badge.innerHTML = `<i data-lucide="user" class="w-4 h-4 text-indigo-600"></i> Vozač`;
        badge.className = "px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 flex items-center gap-1.5";
        openBookingBtn.classList.add('hidden');
        openDriversBtn.classList.add('hidden');
      }

      if (window.lucide) lucide.createIcons();
      listenToFirebase();
      listenToDrivers();
    }

    function listenToFirebase() {
      const selectedDate = document.getElementById('filterDate').value;
      const ref = db.ref('bookings/' + selectedDate);
      
      ref.on('value', (snapshot) => {
        bookingsData = snapshot.val() || {};
        renderBookings();
      });
    }

    function listenToDrivers() {
      db.ref('drivers').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        driversList = Object.keys(data).map(key => ({
          id: key,
          name: data[key].name
        }));
        renderDriversManagement();
        renderBookings();
      });
    }

    window.handleAddDriver = function(e) {
      e.preventDefault();
      const input = document.getElementById('newDriverName');
      const name = input.value.trim();
      if (!name) return;

      db.ref('drivers').push({ name }, (err) => {
        if (!err) {
          input.value = '';
        } else {
          alert("Greška pri dodavanju vozača: " + err.message);
        }
      });
    };

    window.deleteDriver = function(id) {
      if (confirm('Jeste li sigurni da želite obrisati ovog vozača iz liste?')) {
        db.ref(`drivers/${id}`).remove();
      }
    };

    function renderDriversManagement() {
      const container = document.getElementById('driversListContainer');
      container.innerHTML = '';

      if (driversList.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 italic">Nema unesenih vozača.</p>`;
        return;
      }

      driversList.forEach(d => {
        const div = document.createElement('div');
        div.className = "flex items-center justify-between bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-medium text-slate-700";
        div.innerHTML = `
          <span>${d.name}</span>
          <button onclick="deleteDriver('${d.id}')" class="text-slate-400 hover:text-red-500 transition-colors p-1" title="Ukloni">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        `;
        container.appendChild(div);
      });

      if (window.lucide) lucide.createIcons();
    }

    window.loadBookings = function() {
      const selectedDate = document.getElementById('filterDate').value;
      db.ref('bookings/' + activeDate).off();
      activeDate = selectedDate;
      editingBookingId = null;
      driverAddingNoteId = null;
      listenToFirebase();
    };

    window.handleCreateBooking = function(e) {
      if (e) e.preventDefault();
      
      const time = document.getElementById('time').value.trim();
      const pickup = document.getElementById('pickup').value.trim();
      const vehicleType = document.getElementById('vehicleType').value;
      const pax = document.getElementById('pax').value.trim();
      const price = document.getElementById('price').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const note = document.getElementById('note').value.trim();
      const submitBtn = document.getElementById('submitBtn');

      const newBooking = {
        time: time || '-',
        pickup: pickup || '-',
        vehicleType,
        pax: pax || '0',
        price: price || '0',
        phone: phone || '-',
        note,
        driverNote: '',
        driver: '',
        createdAt: Date.now()
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Spremanje...";

      const selectedDate = document.getElementById('filterDate').value;
      db.ref('bookings/' + selectedDate).push(newBooking, (err) => {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i data-lucide="plus" class="w-4 h-4"></i> Spremi Booking`;
        if (window.lucide) lucide.createIcons();
        if (!err) {
          document.getElementById('bookingForm').reset();
          closeBookingModal();
        } else {
          alert("Greška pri spremanju: " + err.message);
        }
      });
    };

    window.updateDriver = function(id, driverName) {
      const selectedDate = document.getElementById('filterDate').value;
      db.ref(`bookings/${selectedDate}/${id}`).update({ driver: driverName }); };  window.deleteBooking = function(id) { if (confirm('Jeste li sigurni da želite obrisati ovaj booking?')) { const selectedDate = document.getElementById('filterDate').value; db.ref(`bookings/${selectedDate}/${id}`).remove(); } };  window.startEditBooking = function(id) { editingBookingId = id; driverAddingNoteId = null; renderBookings(); };  window.cancelEdit = function() { editingBookingId = null; renderBookings(); };  window.saveEditBooking = function(e, id) { e.preventDefault(); const time = document.getElementById(`edit_time_${id}`).value.trim();
      const pickup = document.getElementById(`edit_pickup_${id}`).value.trim(); const vehicleType = document.getElementById(`edit_vehicleType_${id}`).value;
      const pax = document.getElementById(`edit_pax_${id}`).value.trim(); const price = document.getElementById(`edit_price_${id}`).value.trim();
      const phone = document.getElementById(`edit_phone_${id}`).value.trim(); const note = document.getElementById(`edit_note_${id}`).value.trim();

      const updatedData = {
        time: time || '-',
        pickup: pickup || '-',
        vehicleType,
        pax: pax || '0',
        price: price || '0',
        phone: phone || '-',
        note
      };

      const selectedDate = document.getElementById('filterDate').value;
      db.ref(`bookings/${selectedDate}/${id}`).update(updatedData, (err) => {
        if (!err) {
          editingBookingId = null;
          renderBookings();
        } else {
          alert("Greška pri ažuriranju: " + err.message);
        }
      });
    };

    window.startDriverAddNote = function(id) {
      driverAddingNoteId = id;
      renderBookings();
    };

    window.cancelDriverAddNote = function() {
      driverAddingNoteId = null;
      renderBookings();
    };

    window.saveDriverNoteSeparate = function(e, id) {
      e.preventDefault();
