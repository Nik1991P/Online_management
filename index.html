<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upravljanje Bookingom Tura</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDKs (Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- EKRAN ZA PRIJAVU (LOGIN SCREEN) -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-6 sm:p-8">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl mb-3">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Prijava u Sustav</h2>
        <p class="text-xs text-slate-500 mt-1">Unesite lozinku za pristup aplikaciji</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Lozinka za pristup</label>
          <input type="password" id="loginPassword" required placeholder="Unesite lozinku..." 
                 class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
        </div>

        <div id="loginError" class="hidden text-xs font-semibold text-red-500 text-center bg-red-50 p-2.5 rounded-lg border border-red-100">
          Pogrešna lozinka. Pokušajte ponovno.
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Prijavi se
        </button>
      </form>
    </div>
  </div>

  <!-- GLAVNA APLIKACIJA -->
  <div id="appScreen" class="max-w-6xl mx-auto p-4 sm:p-6 hidden">
    <!-- Header -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 mb-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <div class="flex items-center gap-2">
            <i data-lucide="bus" class="w-7 h-7 text-indigo-600"></i>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Booking Tura</h1>
          </div>
          <p class="text-sm text-slate-500 mt-0.5">Online evidencija i dodjela vozača</p>
        </div>

        <!-- Prikaz uloge i Odjava -->
        <div class="flex items-center gap-3">
          <div id="userRoleBadge" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 flex items-center gap-1.5">
            <i data-lucide="shield" class="w-4 h-4"></i>
            <span>Prijavljen</span>
          </div>
          <button onclick="handleLogout()" class="px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:text-red-600 hover:bg-red-50 transition-all border border-slate-200/80 flex items-center gap-1.5" title="Odjava">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            Odjava
          </button>
        </div>
      </div>
    </header>

    <!-- Glavni Sadržaj -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Lijeve Kontrole (Forma + Odabir Datuma) -->
      <div id="leftColumn" class="lg:col-span-4 space-y-6">
        
        <!-- Filter po datumu -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
          <label for="filterDate" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
            <i data-lucide="calendar" class="w-4 h-4 text-indigo-500"></i> Odaberite Datum
          </label>
          <input type="date" id="filterDate" onchange="loadBookings()" 
                 class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all font-medium">
        </div>

        <!-- Forma za unos novog bookinga -->
        <div id="inputFormCard" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
          <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2 pb-3 border-b border-slate-100">
            <i data-lucide="file-plus" class="w-5 h-5 text-indigo-600"></i>
            Novi Booking
          </h2>
          <form id="bookingForm" onsubmit="handleCreateBooking(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Vrijeme tura (npr. 14:30 - ručni upis)</label>
              <input type="text" id="time" required placeholder="14:30" maxlength="5" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Mjesto Pick-up</label>
              <input type="text" id="pickup" required placeholder="npr. Hotel Park / Glavni trg" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Vrsta Vozila</label>
              <select id="vehicleType" required class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="Cabrio Bus">Cabrio Bus</option>
                <option value="Tuk Tuk">Tuk Tuk</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Broj osoba</label>
                <input type="number" id="pax" min="1" max="100" required placeholder="npr. 4" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Broj telefona</label>
                <input type="tel" id="phone" required placeholder="+385 91..." class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
              </div>
            </div>

            <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm transition-all duration-200 flex items-center justify-center gap-2">
              <i data-lucide="plus" class="w-5 h-5"></i>
              Spremi Booking
            </button>
          </form>
        </div>

      </div>

      <!-- Desna Lista Bookinga -->
      <div id="rightColumn" class="lg:col-span-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 pb-4 border-b border-slate-100">
            <div>
              <h2 id="displayDateTitle" class="text-lg font-bold text-slate-900">Raspored Tura</h2>
              <p class="text-xs text-slate-500">Bookinzi sortirani kronološki po vremenu</p>
            </div>
            
            <span id="bookingCount" class="self-start sm:self-auto bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-full border border-indigo-
