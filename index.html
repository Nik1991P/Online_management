<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upravljanje Bookingom Tura</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Firebase SDKs (Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <!-- EKRAN ZA PRIJAVU (LOGIN SCREEN) -->
  <div id="loginScreen" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-200 w-full max-w-md p-6 sm:p-8">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-100 text-indigo-600 rounded-xl mb-3">
          <i data-lucide="lock" class="w-6 h-6"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-900">Prijava u Sustav</h2>
        <p class="text-xs text-slate-500 mt-1">Unesite lozinku za pristup aplikaciji</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Lozinka za pristup</label>
          <input type="password" id="loginPassword" required placeholder="Unesite lozinku..." 
                 class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
        </div>

        <div id="loginError" class="hidden text-xs font-semibold text-red-500 text-center bg-red-50 p-2.5 rounded-lg border border-red-100">
          Pogrešna lozinka. Pokušajte ponovno.
        </div>

        <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Prijavi se
        </button>
      </form>
    </div>
  </div>

  <!-- GLAVNA APLIKACIJA -->
  <div id="appScreen" class="max-w-6xl mx-auto p-4 sm:p-6 hidden">
    <!-- Header -->
    <header class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 mb-6">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <div class="flex items-center gap-2">
            <i data-lucide="bus" class="w-7 h-7 text-indigo-600"></i>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Booking Tura</h1>
          </div>
          <p class="text-sm text-slate-500 mt-0.5">Online evidencija i dodjela vozača</p>
        </div>

        <!-- Prikaz uloge i Odjava -->
        <div class="flex items-center gap-3">
          <div id="userRoleBadge" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 flex items-center gap-1.5">
            <i data-lucide="shield" class="w-4 h-4"></i>
            <span>Prijavljen</span>
          </div>
          <button onclick="handleLogout()" class="px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:text-red-600 hover:bg-red-50 transition-all border border-slate-200/80 flex items-center gap-1.5" title="Odjava">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            Odjava
          </button>
        </div>
      </div>
    </header>

    <!-- Glavni Sadržaj -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- Lijeve Kontrole (Forma + Odabir Datuma) -->
      <div id="leftColumn" class="lg:col-span-4 space-y-6">
        
        <!-- Filter po datumu -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
          <label for="filterDate" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1.5">
            <i data-lucide="calendar" class="w-4 h-4 text-indigo-500"></i> Odaberite Datum
          </label>
          <input type="date" id="filterDate" onchange="loadBookings()" 
                 class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all font-medium">
        </div>

        <!-- Forma za unos novog bookinga -->
        <div id="inputFormCard" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
          <h2 class="text-base font-bold text-slate-900 mb-4 flex items-center gap-2 pb-3 border-b border-slate-100">
            <i data-lucide="file-plus" class="w-5 h-5 text-indigo-600"></i>
            Novi Booking
          </h2>
          <form id="bookingForm" onsubmit="handleCreateBooking(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Vrijeme tura (npr. 14:30 - ručni upis)</label>
              <input type="text" id="time" required placeholder="14:30" maxlength="5" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Mjesto Pick-up</label>
              <input type="text" id="pickup" required placeholder="npr. Hotel Park / Glavni trg" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <div>
              <label class="block text-xs font-medium text-slate-600 mb-1">Vrsta Vozila</label>
              <select id="vehicleType" required class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
                <option value="Cabrio Bus">Cabrio Bus</option>
                <option value="Tuk Tuk">Tuk Tuk</option>
              </select>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Broj osoba</label>
                <input type="number" id="pax" min="1" max="100" required placeholder="npr. 4" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-600 mb-1">Broj telefona</label>
                <input type="tel" id="phone" required placeholder="+385 91..." class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
              </div>
            </div>

            <button type="submit" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-sm transition-all duration-200 flex items-center justify-center gap-2">
              <i data-lucide="plus" class="w-5 h-5"></i>
              Spremi Booking
            </button>
          </form>
        </div>

      </div>

      <!-- Desna Lista Bookinga -->
      <div id="rightColumn" class="lg:col-span-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6 pb-4 border-b border-slate-100">
            <div>
              <h2 id="displayDateTitle" class="text-lg font-bold text-slate-900">Raspored Tura</h2>
              <p class="text-xs text-slate-500">Bookinzi sortirani kronološki po vremenu</p>
            </div>
            
            <span id="bookingCount" class="self-start sm:self-auto bg-indigo-50 text-indigo-700 text-xs font-bold px-3 py-1.5 rounded-full border border-indigo-100">
              0 vožnji
            </span>
          </div>

          <!-- Prikaz Liste -->
          <div id="bookingsList" class="space-y-3.5">
            <!-- Dinamički sadržaj -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Definiranje dozvoljenih lozinki
    const PASSWORDS = {
      admin123: 'admin',
      vozac123: 'driver'
    };

    // Firebase Konfiguracija
    const firebaseConfig = {
      apiKey: "AIzaSyDECTTtb5SYZJ_xUJWB1ySi2NxBXZoV13w",
      authDomain: "online-management-1315c.firebaseapp.com",
      databaseURL: "https://online-management-1315c-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "online-management-1315c",
      storageBucket: "online-management-1315c.firebasestorage.app",
      messagingSenderId: "243674230357",
      appId: "1:243674230357:web:93b0ed58009575ef0a2edc",
      measurementId: "G-VWBNBQGSH4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRole = null; 
    let activeDate = new Date().toISOString().split('T')[0];
    let bookingsData = {};

    window.handleLogin = function(e) {
      if (e) e.preventDefault();
      const passInput = document.getElementById('loginPassword');
      const pass = passInput.value.trim();
      const errorEl = document.getElementById('loginError');

      if (PASSWORDS[pass]) {
        const role = PASSWORDS[pass];
        localStorage.setItem('tour_app_role', role);
        errorEl.classList.add('hidden');
        passInput.value = '';
        initApp(role);
      } else {
        errorEl.classList.remove('hidden');
        passInput.value = '';
      }
    };

    window.handleLogout = function() {
      localStorage.removeItem('tour_app_role');
      currentRole = null;
      document.getElementById('appScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
    };

    function initApp(role) {
      currentRole = role;
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('appScreen').classList.remove('hidden');
      document.getElementById('filterDate').value = activeDate;

      const badge = document.getElementById('userRoleBadge');
      const inputFormCard = document.getElementById('inputFormCard');
      const leftCol = document.getElementById('leftColumn');
      const rightCol = document.getElementById('rightColumn');

      if (role === 'admin') {
        badge.innerHTML = `<i data-lucide="shield-check" class="w-4 h-4 text-emerald-600"></i> Admin (Full Prava)`;
        badge.className = "px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-100 flex items-center gap-1.5";
        inputFormCard.classList.remove('hidden');
        leftCol.className = "lg:col-span-4 space-y-6";
        rightCol.className = "lg:col-span-8";
      } else {
        badge.innerHTML = `<i data-lucide="user" class="w-4 h-4 text-indigo-600"></i> Vozač (Pregled)`;
        badge.className = "px-3.5 py-2 rounded-xl text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 flex items-center gap-1.5";
        inputFormCard.classList.add('hidden');
        leftCol.className = "lg:col-span-3 space-y-6";
        rightCol.className = "lg:col-span-9";
      }

      if (window.lucide) {
        lucide.createIcons();
      }
      listenToFirebase();
    }

    function listenToFirebase() {
      const selectedDate = document.getElementById('filterDate').value;
      const ref = db.ref('bookings/' + selectedDate);
      
      ref.on('value', (snapshot) => {
        bookingsData = snapshot.val() || {};
        renderBookings();
      });
    }

    window.loadBookings = function() {
      const selectedDate = document.getElementById('filterDate').value;
      db.ref('bookings/' + activeDate).off();
      activeDate = selectedDate;
      listenToFirebase();
    };

    window.handleCreateBooking = function(e) {
      if (e) e.preventDefault();
      
      const time = document.getElementById('time').value;
      const pickup = document.getElementById('pickup').value;
      const vehicleType = document.getElementById('vehicleType').value;
      const pax = document.getElementById('pax').value;
      const phone = document.getElementById('phone').value;

      const newBooking = {
        time,
        pickup,
        vehicleType,
        pax,
        phone,
        driver: '',
        createdAt: Date.now()
      };

      const selectedDate = document.getElementById('filterDate').value;
      db.ref('bookings/' + selectedDate).push(newBooking, (err) => {
        if (!err) {
          document.getElementById('bookingForm').reset();
        } else {
          alert("Greška pri spremanju: " + err.message);
        }
      });
    };

    window.updateDriver = function(id, driverName) {
      const selectedDate = document.getElementById('filterDate').value;
      db.ref(`bookings/${selectedDate}/${id}`).update({ driver: driverName });
    };

    window.deleteBooking = function(id) {
      if (confirm('Jeste li sigurni da želite obrisati ovaj booking?')) {
        const selectedDate = document.getElementById('filterDate').value;
        db.ref(`bookings/${selectedDate}/${id}`).remove();
      }
    };

    function renderBookings() {
      const listContainer = document.getElementById('bookingsList');
      const countBadge = document.getElementById('bookingCount');
      const displayTitle = document.getElementById('displayDateTitle');
      
      const formattedDate = new Date(activeDate).toLocaleDateString('hr-HR', { 
        weekday: 'short', 
        day: 'numeric', 
        month: 'numeric', 
        year: 'numeric' 
      });
      displayTitle.textContent = `Raspored (${formattedDate})`;

      const bookingsArray = Object.keys(bookingsData).map(key => ({
        id: key,
        ...bookingsData[key]
      }));

      bookingsArray.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

      countBadge.textContent = `${bookingsArray.length} vožnji`;
      listContainer.innerHTML = '';

      if (bookingsArray.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-12 border-2 border-dashed border-slate-200 rounded-2xl">
            <i data-lucide="calendar-x" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
            <p class="text-sm font-medium text-slate-500">Nema online bookinga za ovaj datum.</p>
          </div>
        `;
        if (window.lucide) lucide.createIcons();
        return;
      }

      bookingsArray.forEach(b => {
        const isBus = b.vehicleType === 'Cabrio Bus';
        const card = document.createElement('div');
        card.className = "p-4 rounded-xl border border-slate-200/90 bg-white hover:border-slate-300 transition-all shadow-xs";

        let driverSection = '';
        if (currentRole === 'admin') {
          driverSection = `
            <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
              <label class="text-xs font-semibold text-slate-500 flex items-center gap-1">
                <i data-lucide="user-check" class="w-3.5 h-3.5 text-indigo-500"></i> Vozač:
              </label>
              <input type="text" 
                     placeholder="Unesi vozača..." 
                     value="${b.driver || ''}" 
                     onchange="updateDriver('${b.id}', this.value)"
                     class="text-xs font-medium bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-indigo-500 outline-none w-44">
            </div>
          `;
        } else {
          driverSection = `
            <div class="mt-3 pt-3 border-t border-slate-100 flex items-center justify-between">
              <span class="text-xs font-medium text-slate-500">Vozač:</span>
              <span class="text-xs font-bold ${b.driver ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'} px-2.5 py-1 rounded-md">
                ${b.driver ? b.driver : 'Nije dodijeljen'}
              </span>
            </div>
          `;
        }

        let deleteBtn = '';
        if (currentRole === 'admin') {
          deleteBtn = `
            <button onclick="deleteBooking('${b.id}')" class="text-slate-400 hover:text-red-500 p-1 rounded-lg transition-colors" title="Obriši">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          `;
        }

        card.innerHTML = `
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-3">
              <div class="bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-1 border border-indigo-100">
                <i data-lucide="clock" class="w-4 h-4"></i>
                ${b.time}
              </div>
              <div>
                <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-semibold ${isBus ? 'bg-sky-50 text-sky-700 border border-sky-100' : 'bg-purple-50 text-purple-700 border border-purple-100'}">
                  ${isBus ? '<i data-lucide="bus" class="w-3 h-3"></i>' : '<i data-lucide="car" class="w-3 h-3"></i>'}
                  ${b.vehicleType}
                </span>
              </div>
            </div>
            ${deleteBtn}
          </div>

          <div class="mt-2 text-xs font-medium text-slate-700 flex items-center gap-1.5">
            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-rose-500"></i>
            <span>Pick-up: <strong>${b.pickup || 'Nije navedeno'}</strong></span>
          </div>

          <div class="mt-3 grid grid-cols-2 gap-2 text-xs">
            <div class="flex items-center gap-1.5 text-slate-600">
              <i data-lucide="users" class="w-3.5 h-3.5 text-slate-400"></i>
              <span>Putnika: <strong class="text-slate-800">${b.pax}</strong></span>
            </div>
            <div class="flex items-center gap-1.5 text-slate-600">
              <i data-lucide="phone" class="w-3.5 h-3.5 text-slate-400"></i>
              <a href="tel:${b.phone}" class="hover:underline text-indigo-600 font-medium">${b.phone}</a>
            </div>
          </div>

          ${driverSection}
        `;

        listContainer.appendChild(card);
      });

      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      
      const savedRole = localStorage.getItem('tour_app_role');
      if (savedRole) {
        initApp(savedRole);
      } else {
        document.getElementById('loginScreen').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
