<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Booking Manager</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <!-- Navigation / Role Switcher -->
    <nav class="bg-white shadow-md border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl">🚐</span>
                    <h1 class="text-xl font-bold text-gray-900">Upravljanje Turalima</h1>
                </div>
                
                <!-- Role Selector Buttons -->
                <div class="flex space-x-1 sm:space-x-2 bg-gray-100 p-1 rounded-lg border border-gray-200">
                    <button id="btnRoleInput" onclick="setRole('input')" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md transition-colors duration-150">
                        ✍️ Unos Bookinga
                    </button>
                    <button id="btnRoleDispatch" onclick="setRole('dispatch')" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md transition-colors duration-150">
                        📋 Dispečer
                    </button>
                    <button id="btnRoleDriver" onclick="setRole('driver')" class="px-3 py-1.5 text-xs sm:text-sm font-medium rounded-md transition-colors duration-150">
                        🚘 Vozač (Pregled)
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- Top Controls: Date Filter -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 mb-6 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3 w-full sm:w-auto">
                <label for="filterDate" class="text-sm font-semibold text-gray-700 whitespace-nowrap">Odaberi Datum:</label>
                <input type="date" id="filterDate" onchange="changeDate()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none w-full sm:w-auto">
            </div>
            
            <div id="roleBadge" class="text-xs px-3 py-1 rounded-full font-semibold bg-blue-100 text-blue-800">
                Aktivna Uloga: Unos Bookinga
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- SECTION 1: Booking Form (Visible to 'input' role) -->
            <div id="sectionForm" class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 sticky top-24">
                    <h2 class="text-lg font-bold text-gray-900 mb-4 border-b pb-2 flex items-center gap-2">
                        <span>➕</span> Novi Booking
                    </h2>
                    
                    <form id="bookingForm" onsubmit="handleCreateBooking(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Vrijeme Vožnje</label>
                            <input type="time" id="time" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Vrsta Vozila</label>
                            <select id="vehicleType" required class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white">
                                <option value="Cabrio Bus">Cabrio Bus</option>
                                <option value="Tuk Tuk">Tuk Tuk</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Broj Putnika (Pax)</label>
                            <input type="number" id="pax" min="1" required placeholder="Npr. 4" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kontakt Telefon</label>
                            <input type="tel" id="phone" required placeholder="+385 91 123 4567" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                        </div>

                        <button type="submit" class="w-full bg-brand-600 hover:bg-brand-700 text-white font-bold py-2.5 px-4 rounded-lg transition duration-200 shadow">
                            Spremi Booking
                        </button>
                    </form>
                </div>
            </div>

            <!-- SECTION 2: Bookings List (Visible to all) -->
            <div id="sectionList" class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h2 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                            <span>📅</span> Lista Vožnji za <span id="displayDate" class="text-brand-600">--</span>
                        </h2>
                        <span id="bookingCount" class="bg-gray-100 text-gray-700 text-xs font-semibold px-2.5 py-1 rounded-full border border-gray-200">
                            0 vožnji
                        </span>
